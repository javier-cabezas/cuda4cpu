name: A program fails
description: A CUDA or HIP program doesn't compile, crashes or gives wrong results
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: The error, crash or wrong output, and what you expected.
    validations:
      required: true
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The smallest program that shows it, or a link to the project and the file.
      render: cpp
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: How you built it (`cuda4cpu-c++ ...`, or your CMake setup).
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Compiler and version, Linux distribution, cuda4cpu commit.
    validations:
      required: true
