name: Packages

# The release archive, the Docker image and the MCP Registry entry. Pull
# requests build and test the archive (installed by this repository's action)
# and the image; a published release uploads the archive to it, pushes the
# image to ghcr.io and publishes server.json to the MCP Registry.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  archive:
    name: release archive
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up
        id: setup
        uses: ./.github/actions/setup
        with:
          packages: ninja-build g++-14
          ccache-key: archive

      # A release must be tagged with the version that CMake and server.json
      # declare
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test "$(jq -r .version server.json)" = "$version"
          test "$(jq -r '.packages[0].identifier' server.json)" = "ghcr.io/javier-cabezas/cuda4cpu:$version"
          if [ "${{ github.event_name }}" = release ]; then
            test "${{ github.event.release.tag_name }}" = "v$version"
          fi

      # Without libnuma, which machines that run the archive may not have
      - name: Build and install
        run: |
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCUDA4CPU_BUILD_TESTS=OFF -DCUDA4CPU_BUILD_BENCHMARKS=OFF -DCUDA4CPU_ENABLE_NUMA=OFF
          cmake --build build/package
          name="cuda4cpu-${{ steps.version.outputs.version }}-linux-x86_64"
          cmake --install build/package --prefix "dist/$name"
          ldd "dist/$name/lib/libcuda4cpu.so.0"
          tar -C dist -czf dist/cuda4cpu-linux-x86_64.tar.gz "$name"
          (cd dist && sha256sum cuda4cpu-linux-x86_64.tar.gz > cuda4cpu-linux-x86_64.tar.gz.sha256)

      - name: Install the archive with the action
        id: action
        uses: ./
        with:
          archive: dist/cuda4cpu-linux-x86_64.tar.gz

      - name: Test the installation
        run: packaging/smoke-test.sh "${{ steps.action.outputs.prefix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: cuda4cpu-linux-x86_64
          path: dist/cuda4cpu-linux-x86_64.tar.gz*

      - name: Upload the archive to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" --clobber \
             dist/cuda4cpu-linux-x86_64.tar.gz dist/cuda4cpu-linux-x86_64.tar.gz.sha256

      - name: Save the compiler cache
        if: always()
        uses: ./.github/actions/save-ccache
        with:
          key: ${{ steps.setup.outputs.ccache-key }}

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cuda4cpu:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The repository is mounted for the example programs; the MCP server
      # also answers through docker run -i, as MCP clients start it
      - name: Test the image
        run: |
          docker run --rm -v "$PWD:/src:ro" cuda4cpu:test /src/packaging/smoke-test.sh /usr/local /src
          echo '{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-06-18", "capabilities": {}}}' |
            docker run -i --rm cuda4cpu:test | tee "$RUNNER_TEMP/initialize.json"
          jq -e '.result.serverInfo.name == "cuda4cpu"' "$RUNNER_TEMP/initialize.json"

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tagged with the version without its v, as server.json names it
      - name: Read the version
        if: github.event_name == 'release'
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Push the image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/javier-cabezas/cuda4cpu:${{ steps.version.outputs.version }}
            ghcr.io/javier-cabezas/cuda4cpu:latest
          cache-from: type=gha

  # server.json names the image, which must exist and carry its name in the
  # io.modelcontextprotocol.server.name label
  mcp-registry:
    name: MCP Registry
    if: github.event_name == 'release'
    needs: [archive, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar -xzf "$archive" mcp-publisher

      - name: Publish server.json
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
