name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler.name }} / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
        compiler:
          - { name: gcc-14, cxx: g++-14, packages: g++-14 }
          - { name: clang-18, cxx: clang++-18, packages: clang-18 libomp-18-dev }
    env:
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libnuma-dev ${{ matrix.compiler.packages }}

      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

      # Correct programs give the same results whatever the order in which the
      # threads of a block run between barriers
      - name: Test with the threads of each block in reverse and in random order
        if: matrix.compiler.name == 'gcc-14' && matrix.preset == 'release'
        run: |
          CUDA4CPU_SCHEDULE=reverse ctest --preset release -E '^schedule_'
          CUDA4CPU_SCHEDULE=random:${{ github.run_id }} ctest --preset release -E '^schedule_'

      - name: Install
        run: cmake --install build/${{ matrix.preset }} --prefix "${{ runner.temp }}/cuda4cpu"

  # The _setjmp/_longjmp fallback used on architectures without the assembly
  # context switch
  portable-context:
    name: gcc-14 / debug / portable context
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libnuma-dev g++-14

      - name: Configure, build and test
        run: |
          cmake --preset debug -DCUDA4CPU_PORTABLE_CONTEXT=ON
          cmake --build --preset debug
          ctest --preset debug

  # cuda4cpu tells AddressSanitizer about its fiber stack switches; the whole
  # test suite must run clean. (The driver test builds a program without the
  # sanitizer flags against the instrumented library.)
  sanitizers:
    name: gcc-14 / AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
      ASAN_OPTIONS: allocator_may_return_null=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libnuma-dev g++-14 gdb

      - name: Configure, build and test
        run: |
          cmake --preset debug "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake --build --preset debug
          ctest --preset debug -E '^driver$'

  # With CUDA4CPU_ENABLE_VALGRIND, the fiber stacks are registered with
  # Valgrind, which must report no errors. The slowest tests are left out.
  valgrind:
    name: gcc-14 / Valgrind
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libnuma-dev g++-14 valgrind

      - name: Build
        run: |
          cmake --preset debug -DCUDA4CPU_ENABLE_VALGRIND=ON -DCUDA4CPU_BUILD_BENCHMARKS=OFF
          cmake --build --preset debug

      - name: Test under Valgrind
        working-directory: build/debug/tests
        run: |
          for test in barriers warp atomics launch runtime cooperative_groups graphs rewrite_features sample_vector_add sample_softmax hip_kernels; do
            echo "::group::$test"
            OMP_NUM_THREADS=2 valgrind -q --error-exitcode=1 ./$test
            echo "::endgroup::"
          done

  # Real CUDA and HIP programs, unmodified: a curated set of NVIDIA's
  # cuda-samples, Rodinia and AMD's rocm-examples, fetched at the revisions in
  # compat/suites.json. Fails if a program that passes in compat/baseline.json
  # stops passing.
  compatibility:
    name: gcc-14 / CUDA and HIP programs (cuda-samples, Rodinia, rocm-examples)
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
      CC: gcc-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libnuma-dev g++-14 gcc-14

      - name: Build cuda4cpu
        run: |
          cmake --preset release -DCUDA4CPU_BUILD_TESTS=OFF -DCUDA4CPU_BUILD_BENCHMARKS=OFF
          cmake --build --preset release

      - name: Build and run the programs
        run: |
          python3 compat/run.py --driver build/release/tools/cuda4cpu-c++ --work "${{ runner.temp }}/compat" \
                                --baseline compat/baseline.json --report "${{ runner.temp }}/compatibility.md" \
                                --json "${{ runner.temp }}/compatibility.json" --jobs 4 --timeout 600

      - name: Report
        if: always()
        run: cat "${{ runner.temp }}/compatibility.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility
          path: |
            ${{ runner.temp }}/compatibility.md
            ${{ runner.temp }}/compatibility.json
